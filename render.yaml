services:
  # ─── DepShield Backend Web Service (FastAPI) ─────────────────────────
  - type: web
    name: depshield-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'if [ -n "$DATABASE_URL" ]; then alembic upgrade head; fi && uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: depshield-db
          property: connectionString
      - key: BIFROST_BASE_URL
        value: http://localhost:8080/openai
      - key: BIFROST_VIRTUAL_KEY
        sync: false

  # ─── DepShield Frontend Static Site (React + Vite) ───────────────────
  - type: web
    name: depshield-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: depshield-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # ─── Managed PostgreSQL (Render Free Tier) ──────────────────────────
  - name: depshield-db
    plan: free
    region: oregon
    databaseName: depshield
    user: depshield
