[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depshield-cli"
version = "0.1.0"
description = "DepShield developer CLI"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<26",
]

[project.scripts]
depshield = "depshield_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["depshield_cli*"]
